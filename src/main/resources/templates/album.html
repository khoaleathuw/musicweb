<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${album.name + ' — K2BT'}">
        Album — K2BT
    </title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">

    <link rel="stylesheet"
          th:href="@{/css/home.css}">

    <link rel="stylesheet"
          th:href="@{/css/album.css}">

</head>

<body>

<div class="page">

    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="noise"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="/home"
           class="brand">

            <span class="brand-mark"></span>

            K2BT

        </a>


        <nav class="main-nav">

            <a href="/home"
               class="nav-link">

                HOME

            </a>

            <a href="/home#trending"
               class="nav-link">

                DISCOVER

            </a>

        </nav>


        <div class="nav-right">

            <a href="/home"
               class="search-button">

                ← BACK

            </a>

        </div>

    </header>



    <!-- ALBUM -->

    <main class="album-page">


        <section class="album-hero">


            <img
                    class="album-hero-bg"

                    th:src="${album.coverUrl != null
                    && !album.coverUrl.isEmpty()
                    ? album.coverUrl
                    : '/images/default-album.jpg'}"

                    th:alt="${album.name}">


            <div class="album-hero-overlay"></div>


            <div class="album-hero-content">


                <div class="album-cover">

                    <img
                            th:src="${album.coverUrl != null
                            && !album.coverUrl.isEmpty()
                            ? album.coverUrl
                            : '/images/default-album.jpg'}"

                            th:alt="${album.name}">

                </div>


                <div class="album-info">


                    <a
                            href="/home"
                            class="album-back">

                        ← BACK TO HOME

                    </a>


                    <span class="album-label">
                        ALBUM
                    </span>


                    <h1
                            th:text="${album.name}">

                        Album

                    </h1>


                    <p>

                        <strong
                                th:text="${album.artist != null
                                ? album.artist.name
                                : 'Unknown Artist'}">

                            Artist

                        </strong>

                        <span> · </span>

                        <span
                                th:text="${songs != null
                                ? songs.size()
                                : 0}">

                            0

                        </span>

                        songs

                    </p>

                </div>

            </div>

        </section>



        <!-- SONGS -->

        <section class="album-songs">


            <div class="album-section-header">

                <h2>
                    TRACKS
                </h2>


                <span
                        th:text="${songs != null
                        ? songs.size()
                        : 0}">

                    0

                </span>

            </div>


            <div
                    class="album-song-list"

                    th:if="${songs != null
                    && !songs.isEmpty()}">


                <article
                        class="album-song"

                        th:each="song, stat : ${songs}"

                        th:attr="
                            data-id=${song.id},
                            data-title=${song.title},
                            data-artist=${song.artist != null
                                ? song.artist.name
                                : 'Unknown Artist'},
                            data-album=${song.album != null
                                ? song.album.name
                                : album.name},
                            data-genre=${song.genre},
                            data-image=${song.coverUrl},
                            data-audio=${song.audioUrl}
                        ">


                    <span
                            class="song-index"

                            th:text="${stat.count}">

                        1

                    </span>


                    <div class="song-cover">

                        <img
                                th:src="${song.coverUrl}"
                                th:alt="${song.title}"
                                loading="lazy">

                    </div>


                    <div class="song-details">

                        <h3
                                th:text="${song.title}">

                            Song

                        </h3>


                        <p
                                th:text="${song.artist != null
                                ? song.artist.name
                                : 'Unknown Artist'}">

                            Artist

                        </p>

                    </div>


                    <span class="song-genre">

                        <span
                                th:text="${song.genre != null
                                && !song.genre.isEmpty()
                                ? song.genre
                                : 'K2BT MUSIC'}">

                            K2BT MUSIC

                        </span>

                    </span>


                    <button
                            class="song-play"
                            type="button">

                        ▶

                    </button>

                </article>

            </div>



            <!-- EMPTY -->

            <div
                    class="album-empty"

                    th:if="${songs == null
                    || songs.isEmpty()}">

                <div class="empty-icon">
                    ♪
                </div>


                <h3>
                    No songs in this album
                </h3>


                <p>

                    This album doesn't have
                    any songs yet.

                </p>

            </div>

        </section>

    </main>



    <!-- PLAYER -->

    <div
            class="music-player"
            id="musicPlayer">


        <div class="player-song">

            <div class="player-cover">

                <img
                        id="playerCover"
                        src="/images/default-album.jpg"
                        alt="Cover">

            </div>


            <div class="player-info">

                <strong id="playerTitle">
                    Nothing playing
                </strong>

                <span id="playerArtist">
                    K2BT
                </span>

            </div>

        </div>


        <div class="player-center">

            <div class="player-controls">

                <button
                        id="shuffleButton"
                        type="button">
                    ⤨
                </button>

                <button
                        id="previousButton"
                        type="button">
                    |◀
                </button>

                <button
                        class="main-play"
                        id="mainPlayButton"
                        type="button">
                    ▶
                </button>

                <button
                        id="nextButton"
                        type="button">
                    ▶|
                </button>

                <button
                        id="repeatButton"
                        type="button">
                    ↻
                </button>

            </div>


            <div class="progress-wrapper">

                <span id="currentTime">
                    0:00
                </span>


                <input
                        type="range"
                        id="progressBar"
                        min="0"
                        max="0"
                        value="0"
                        step="0.1">


                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="player-right">

            <button
                    id="volumeButton"
                    type="button">
                🔊
            </button>


            <input
                    type="range"
                    id="volumeBar"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8">

        </div>

    </div>


    <audio
            id="audioPlayer"
            preload="metadata">
    </audio>

</div>


<script th:src="@{/js/album.js}"></script>

</body>

</html>
